<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Horse Gallery — Anabia Naeem</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --primary: #240048;
    --accent: #7B2FBE;
    --light-purple: #f3e8ff;
    --soft: #faf5ff;
    --text: #1a0030;
    --muted: #8b6aa1;
    --border: #e9d5ff;
  }

  body {
    background: var(--soft);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }

  nav {
    padding: 1.2rem 2.5rem;
    display: flex; justify-content: space-between; align-items: center;
    background: #fff;
    border-bottom: 1px solid var(--border);
  }
  .nav-logo {
    font-family: 'Playfair Display', serif;
    font-size: 1.3rem; font-weight: 700;
    color: var(--primary);
  }
  .nav-logo span { color: var(--accent); }
  .nav-tag {
    display: flex; align-items: center; gap: 0.5rem;
    font-size: 0.75rem; color: var(--muted);
    border: 1px solid var(--border);
    padding: 0.3rem 0.8rem;
    border-radius: 20px;
    background: var(--light-purple);
  }
  .nav-dot { width: 6px; height: 6px; background: #4CAF50; border-radius: 50%; }

  .hero {
    padding: 3.5rem 2.5rem 2rem;
    max-width: 1200px; margin: 0 auto;
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 3rem; align-items: center;
  }
  .hero-text h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.5rem, 4vw, 3.8rem);
    font-weight: 700;
    color: var(--primary);
    line-height: 1.15;
    margin-bottom: 1rem;
  }
  .hero-text h1 em {
    font-style: italic;
    color: var(--accent);
  }
  .hero-text p {
    color: var(--muted);
    font-size: 1rem;
    line-height: 1.8;
    margin-bottom: 1.5rem;
  }
  .hero-badge {
    display: inline-flex; align-items: center; gap: 0.5rem;
    background: var(--primary);
    color: #fff;
    padding: 0.5rem 1.2rem;
    border-radius: 30px;
    font-size: 0.8rem;
    font-weight: 500;
  }

  .hero-featured {
    position: relative;
    border-radius: 20px;
    overflow: hidden;
    aspect-ratio: 4/3;
    box-shadow: 0 20px 60px rgba(36,0,72,0.15);
    cursor: pointer;
    border: 2px solid var(--border);
  }
  .hero-featured img {
    width: 100%; height: 100%;
    object-fit: cover;
    transition: transform 0.5s;
  }
  .hero-featured:hover img { transform: scale(1.04); }
  .hero-featured .featured-label {
    position: absolute; top: 1rem; left: 1rem;
    background: var(--accent);
    color: #fff;
    font-size: 0.7rem; font-weight: 600;
    padding: 0.3rem 0.8rem;
    border-radius: 20px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .divider {
    max-width: 1200px; margin: 0 auto;
    padding: 0 2.5rem;
    display: flex; align-items: center; gap: 1rem;
    margin-bottom: 2rem;
  }
  .divider-line { flex: 1; height: 1px; background: var(--border); }
  .divider-text {
    font-family: 'Playfair Display', serif;
    font-size: 1rem; color: var(--muted);
    white-space: nowrap;
  }

  .gallery {
    max-width: 1200px; margin: 0 auto;
    padding: 0 2.5rem 3rem;
  }
  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 0.8rem;
  }
  .gallery-item {
    position: relative;
    border-radius: 12px;
    overflow: hidden;
    aspect-ratio: 1;
    cursor: pointer;
    transition: transform 0.3s, box-shadow 0.3s;
    border: 1.5px solid var(--border);
  }
  .gallery-item:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 30px rgba(36,0,72,0.15);
    border-color: var(--accent);
  }
  .gallery-item img {
    width: 100%; height: 100%;
    object-fit: cover;
    transition: transform 0.4s;
  }
  .gallery-item:hover img { transform: scale(1.08); }
  .gallery-item .overlay {
    position: absolute; inset: 0;
    background: rgba(36,0,72,0.45);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity 0.3s;
  }
  .gallery-item:hover .overlay { opacity: 1; }
  .overlay-icon { color: #fff; font-size: 1.5rem; }

  .stats-bar {
    background: var(--primary);
    padding: 2rem 2.5rem;
    display: flex; justify-content: center; gap: 4rem;
  }
  .stat { text-align: center; }
  .stat-num {
    font-family: 'Playfair Display', serif;
    font-size: 2rem; font-weight: 700;
    color: #e9d5ff;
  }
  .stat-label {
    font-size: 0.75rem; color: rgba(255,255,255,0.45);
    margin-top: 0.3rem; letter-spacing: 0.08em; text-transform: uppercase;
  }

  .lightbox {
    display: none; position: fixed;
    inset: 0; background: rgba(36,0,72,0.95);
    z-index: 1000;
    align-items: center; justify-content: center;
    padding: 2rem;
  }
  .lightbox.active { display: flex; }
  .lightbox img {
    max-width: 90vw; max-height: 85vh;
    border-radius: 12px; object-fit: contain;
    box-shadow: 0 30px 80px rgba(0,0,0,0.5);
  }
  .lightbox-close {
    position: absolute; top: 1.5rem; right: 1.5rem;
    background: var(--accent); border: none; border-radius: 50%;
    width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: #fff; font-size: 1.2rem;
  }

  footer {
    text-align: center; padding: 1.5rem;
    background: var(--primary);
    border-top: 1px solid rgba(255,255,255,0.05);
    color: rgba(255,255,255,0.35); font-size: 0.8rem;
  }
  footer strong { color: #e9d5ff; }

  @media (max-width: 768px) {
    .hero { grid-template-columns: 1fr; }
    .gallery-grid { grid-template-columns: repeat(3, 1fr); }
    .stats-bar { gap: 2rem; }
  }
</style>
</head>
<body>

<nav>
  <div class="nav-logo">Cloud by <span>Anabia</span></div>
  <div class="nav-tag"><span class="nav-dot"></span> Hosted on AWS S3</div>
</nav>

<div class="hero">
  <div class="hero-text">
    <h1>The Art of<br><em>Horses</em></h1>
    <p>A curated collection of beautiful horses — photographed, collected, and served from the cloud.</p>
    <div class="hero-badge">☁️ Powered by AWS S3</div>
  </div>
  <div class="hero-featured" onclick="openLightbox('https://anabiyaa-image-gallery.s3.us-east-1.amazonaws.com/h1.jpg')">
    <div class="featured-label">Featured</div>
    <img src="https://anabiyaa-image-gallery.s3.us-east-1.amazonaws.com/h1.jpg" alt="Featured Horse">
  </div>
</div>

<div class="divider">
  <div class="divider-line"></div>
  <div class="divider-text">The Collection</div>
  <div class="divider-line"></div>
</div>

<div class="gallery">
  <div class="gallery-grid">
    <div class="gallery-item" onclick="openLightbox('https://anabiyaa-image-gallery.s3.us-east-1.amazonaws.com/h1.jpg')">
      <img src="https://anabiyaa-image-gallery.s3.us-east-1.amazonaws.com/h1.jpg" alt="Horse 1">
      <div class="overlay"><div class="overlay-icon">🔍</div></div>
    </div>
    <div class="gallery-item" onclick="openLightbox('https://anabiyaa-image-gallery.s3.us-east-1.amazonaws.com/h2.jpg')">
      <img src="https://anabiyaa-image-gallery.s3.us-east-1.amazonaws.com/h2.jpg" alt="Horse 2">
      <div class="overlay"><div class="overlay-icon">🔍</div></div>
    </div>
    <div class="gallery-item" onclick="openLightbox('https://anabiyaa-image-gallery.s3.us-east-1.amazonaws.com/h3.jpg')">
      <img src="https://anabiyaa-image-gallery.s3.us-east-1.amazonaws.com/h3.jpg" alt="Horse 3">
      <div class="overlay"><div class="overlay-icon">🔍</div></div>
    </div>
    <div class="gallery-item" onclick="openLightbox('https://anabiyaa-image-gallery.s3.us-east-1.amazonaws.com/h4.jpg')">
      <img src="https://anabiyaa-image-gallery.s3.us-east-1.amazonaws.com/h4.jpg" alt="Horse 4">
      <div class="overlay"><div class="overlay-icon">🔍</div></div>
    </div>
    <div class="gallery-item" onclick="openLightbox('https://anabiyaa-image-gallery.s3.us-east-1.amazonaws.com/h5.jpg')">
      <img src="https://anabiyaa-image-gallery.s3.us-east-1.amazonaws.com/h5.jpg" alt="Horse 5">
      <div class="overlay"><div class="overlay-icon">🔍</div></div>
    </div>
  </div>
</div>

<div class="stats-bar">
  <div class="stat"><div class="stat-num">6</div><div class="stat-label">Images</div></div>
  <div class="stat"><div class="stat-num">S3</div><div class="stat-label">AWS Storage</div></div>
  <div class="stat"><div class="stat-num">☁️</div><div class="stat-label">Cloud Hosted</div></div>
</div>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <img id="lightbox-img" src="" alt="Full size">
</div>

<footer>
  Images stored on <strong>AWS S3</strong> · Built by <strong>Anabia Naeem</strong>
</footer>

<script>
  function openLightbox(src) {
    document.getElementById('lightbox-img').src = src;
    document.getElementById('lightbox').classList.add('active');
  }
  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('active');
  }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });
</script>
</body>
</html>
